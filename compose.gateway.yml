name: new-api-gateway

# Test deployment credentials. Change this value before a fresh install to
# change the initial admin, PostgreSQL and Redis passwords together.
x-test-password: &test-password 'Ab123456!@#'

x-postgres-env: &postgres-env
  POSTGRES_DB: newapi
  POSTGRES_USER: newapi
  POSTGRES_PASSWORD: *test-password

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  gateway:
    image: ${GATEWAY_IMAGE:-new-api-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        BUN_IMAGE: ${BUN_IMAGE:-docker.m.daocloud.io/oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d}
        GO_IMAGE: ${GO_IMAGE:-docker.m.daocloud.io/library/golang:1.26.10-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-docker.m.daocloud.io/library/debian:bookworm-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR-https://mirrors.tuna.tsinghua.edu.cn}
    restart: unless-stopped
    init: true
    stop_grace_period: 130s
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: *test-password
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: *test-password
      # Fixed application keys: no generation step and nothing to memorize.
      # Keep these stable after initialization; login password changes do not
      # require changing application keys.
      SESSION_SECRET: 'Ab123456!@#'
      CRYPTO_SECRET: 'Ab123456!@#'
      TZ: Asia/Shanghai
      DEFAULT_LANGUAGE: zh-CN
      NODE_NAME: gateway-1
      ERROR_LOG_ENABLED: "true"
      SQL_MAX_OPEN_CONNS: "50"
      SQL_MAX_IDLE_CONNS: "10"
      REDIS_POOL_SIZE: "20"
      SYNC_FREQUENCY: "10"
      SHUTDOWN_TIMEOUT_SECONDS: "120"
      STREAMING_TIMEOUT: "300"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-none}
    volumes:
      - gateway_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536}
    restart: unless-stopped
    environment:
      <<: *postgres-env
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d newapi"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4.12-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: *test-password
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  gateway_data:
  postgres_data:
  redis_data:
